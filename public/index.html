<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود و ثبت‌نام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8edf6;
    --surface: #ffffff;
    --ink: #121c36;
    --muted: #5d6882;
    --line: #cfd7e6;
    --accent: #2a52e0;
    --accent-ink: #ffffff;
    --panel: #1b2f8f;
    --error: #b42a2a;
    --error-bg: #fbeaea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1426;
      --surface: #161e38;
      --ink: #eaeefb;
      --muted: #9aa5c4;
      --line: #2b3659;
      --accent: #6f8bff;
      --accent-ink: #0b1230;
      --panel: #0a1a5c;
      --error: #ff8f8f;
      --error-bg: #3a1c24;
    }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Vazirmatn", Tahoma, system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }

  /* پنل تایپوگرافیک سمت چپ */
  .panel {
    background: var(--panel);
    color: #fff;
    padding: 56px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    position: relative;
    overflow: hidden;
  }
  .panel h2 {
    margin: 0;
    font-size: clamp(64px, 11vw, 168px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .panel p { margin: 24px 0 0; max-width: 28ch; font-size: 18px; line-height: 1.9; opacity: .85; }

  /* ستون فرم */
  main {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }
  .box { width: 100%; max-width: 400px; }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 2px solid var(--line);
    margin-bottom: 32px;
  }
  .tab {
    font: inherit;
    font-size: 17px;
    font-weight: 500;
    background: none;
    border: 0;
    padding: 12px 0;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 700; }

  h1 { font-size: 28px; margin: 0 0 6px; font-weight: 700; }
  .sub { margin: 0 0 28px; color: var(--muted); line-height: 1.8; }

  label { display: block; font-size: 14px; font-weight: 500; margin: 0 0 6px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%;
    font: inherit;
    font-size: 16px;
    padding: 13px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
  }
  input[dir="ltr"] { text-align: left; }
  input:focus-visible, button:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .pw { position: relative; }
  .pw input { padding-inline-end: 64px; }
  .pw button {
    position: absolute; inset-block: 6px; inset-inline-end: 6px;
    font: inherit; font-size: 13px;
    background: none; border: 0; color: var(--muted); cursor: pointer;
    padding: 0 10px; border-radius: 6px;
  }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .error {
    background: var(--error-bg);
    color: var(--error);
    border-radius: 8px;
    padding: 11px 14px;
    font-size: 14px;
    margin-bottom: 18px;
    line-height: 1.7;
  }
  .error[hidden] { display: none; }

  .submit {
    width: 100%;
    font: inherit;
    font-size: 17px;
    font-weight: 700;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  .submit[disabled] { opacity: .6; cursor: progress; }

  .switch { margin-top: 22px; font-size: 14px; color: var(--muted); text-align: center; }
  .switch button { font: inherit; background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 0; }

  .welcome .badge {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; font-size: 28px; font-weight: 900;
    margin-bottom: 20px;
  }
  .welcome .submit { background: transparent; color: var(--ink); border: 1.5px solid var(--line); margin-top: 8px; }

  [hidden] { display: none !important; }

  @media (max-width: 800px) {
    body { grid-template-columns: 1fr; }
    .panel { padding: 28px 24px; min-height: 0; }
    .panel h2 { font-size: 56px; }
    .panel p { display: none; }
  }
</style>
</head>
<body>

<aside class="panel" aria-hidden="true">
  <h2 id="panelTitle">خوش آمدید</h2>
  <p id="panelText">با حساب خودتان وارد شوید تا از جایی که مانده بودید ادامه دهید.</p>
</aside>

<main>
  <div class="box">

    <!-- فرم‌ها -->
    <section id="authView">
      <div class="tabs" role="tablist" aria-label="ورود یا ثبت‌نام">
        <button class="tab" role="tab" id="tab-login" aria-controls="form-login" aria-selected="true">ورود</button>
        <button class="tab" role="tab" id="tab-signup" aria-controls="form-signup" aria-selected="false">ثبت‌نام</button>
      </div>

      <div id="error" class="error" role="alert" hidden></div>

      <form id="form-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
        <h1>ورود به حساب</h1>
        <p class="sub">ایمیل و رمز عبور خود را وارد کنید.</p>
        <div class="field">
          <label for="login-email">ایمیل</label>
          <input id="login-email" name="email" type="email" dir="ltr" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="login-password">رمز عبور</label>
          <div class="pw">
            <input id="login-password" name="password" type="password" dir="ltr" autocomplete="current-password" required>
            <button type="button" data-toggle="login-password">نمایش</button>
          </div>
        </div>
        <button class="submit" type="submit">ورود</button>
        <p class="switch">حساب ندارید؟ <button type="button" data-go="signup">ثبت‌نام کنید</button></p>
      </form>

      <form id="form-signup" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
        <h1>ساخت حساب جدید</h1>
        <p class="sub">فقط چند ثانیه طول می‌کشد.</p>
        <div class="field">
          <label for="signup-name">نام</label>
          <input id="signup-name" name="name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="signup-email">ایمیل</label>
          <input id="signup-email" name="email" type="email" dir="ltr" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="signup-password">رمز عبور</label>
          <div class="pw">
            <input id="signup-password" name="password" type="password" dir="ltr" autocomplete="new-password" minlength="8" required>
            <button type="button" data-toggle="signup-password">نمایش</button>
          </div>
          <div class="hint">حداقل ۸ کاراکتر</div>
        </div>
        <button class="submit" type="submit">ساخت حساب</button>
        <p class="switch">قبلاً ثبت‌نام کرده‌اید؟ <button type="button" data-go="login">وارد شوید</button></p>
      </form>
    </section>

    <!-- پس از ورود -->
    <section id="welcomeView" class="welcome" hidden>
      <div class="badge" id="avatar"></div>
      <h1 id="welcomeName"></h1>
      <p class="sub" id="welcomeEmail" dir="ltr" style="text-align:right"></p>
      <button class="submit" id="logout" type="button">خروج از حساب</button>
    </section>

  </div>
</main>

<script>
  const $ = (s) => document.querySelector(s);
  const errorBox = $("#error");
  const texts = {
    login:  { title: "خوش آمدید",   text: "با حساب خودتان وارد شوید تا از جایی که مانده بودید ادامه دهید." },
    signup: { title: "شروع کنید",   text: "یک حساب بسازید؛ فقط نام، ایمیل و یک رمز عبور لازم است." },
  };

  function showError(msg) { errorBox.textContent = msg; errorBox.hidden = !msg; }

  function setMode(mode) {
    const isLogin = mode === "login";
    $("#form-login").hidden = !isLogin;
    $("#form-signup").hidden = isLogin;
    $("#tab-login").setAttribute("aria-selected", isLogin);
    $("#tab-signup").setAttribute("aria-selected", !isLogin);
    $("#panelTitle").textContent = texts[mode].title;
    $("#panelText").textContent = texts[mode].text;
    showError("");
  }

  function showWelcome(user) {
    $("#authView").hidden = true;
    $("#welcomeView").hidden = false;
    $("#avatar").textContent = user.name.trim().charAt(0);
    $("#welcomeName").textContent = `سلام ${user.name}`;
    $("#welcomeEmail").textContent = user.email;
    $("#panelTitle").textContent = "سلام";
    $("#panelText").textContent = "با موفقیت وارد شدید.";
  }

  function showAuth() {
    $("#welcomeView").hidden = true;
    $("#authView").hidden = false;
    setMode("login");
  }

  async function api(url, body) {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "خطایی رخ داد. دوباره تلاش کنید.");
    return data;
  }

  function handleForm(form, url) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      showError("");
      const btn = form.querySelector(".submit");
      const label = btn.textContent;
      btn.disabled = true;
      btn.textContent = "لطفاً صبر کنید…";
      try {
        const { user } = await api(url, Object.fromEntries(new FormData(form)));
        form.reset();
        showWelcome(user);
      } catch (err) {
        showError(err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = label;
      }
    });
  }

  handleForm($("#form-login"), "/api/login");
  handleForm($("#form-signup"), "/api/signup");

  $("#tab-login").onclick = () => setMode("login");
  $("#tab-signup").onclick = () => setMode("signup");
  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => setMode(b.dataset.go)));

  document.querySelectorAll("[data-toggle]").forEach((b) => {
    b.onclick = () => {
      const input = document.getElementById(b.dataset.toggle);
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      b.textContent = show ? "پنهان" : "نمایش";
    };
  });

  $("#logout").onclick = async () => {
    await api("/api/logout");
    showAuth();
  };

  // اگر قبلاً وارد شده بود
  fetch("/api/me").then((r) => (r.ok ? r.json() : null)).then((d) => d && d.user && showWelcome(d.user));
</script>
</body>
</html>
